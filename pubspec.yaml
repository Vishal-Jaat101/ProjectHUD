name: project_hud
description: "ProjectHUD — Voice-first AI-powered HUD navigation & road-safety app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Google Maps
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.14.0
  
  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.0
  firebase_storage: ^12.3.0
  
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Routing
  go_router: ^14.6.0
  
  # Location & sensors
  geolocator: ^13.0.1
  sensors_plus: ^6.1.1
  
  # Voice / Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  
  # HTTP for Gemini API, Maps APIs
  http: ^1.2.2
  dio: ^5.7.0
  
  # BLE
  flutter_blue_plus: ^1.35.2
  
  # Google Cast (Chromecast)
  # cast_framework: (placeholder - will use platform channel)
  
  # UI utilities
  wakelock_plus: ^1.2.8
  flutter_compass: ^0.8.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  receive_sharing_intent: ^1.8.0
  uni_links: ^0.5.1
  permission_handler: ^11.3.1
  
  # Heatmap / visualization
  syncfusion_flutter_maps: ^27.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
  
  assets:
    - assets/icons/
    - assets/demo/
    - assets/fonts/
