allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// Plugins that predate AGP 8 (for example uni_links) do not declare a
// namespace in their build file, which AGP 8+ requires. Fill any missing
// namespace from the plugin's own AndroidManifest package attribute.
gradle.beforeProject { subproject ->
    subproject.afterEvaluate {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null && androidExt.namespace == null) {
            def manifestFile = subproject.file('src/main/AndroidManifest.xml')
            if (manifestFile.exists()) {
                def pkg = new XmlParser().parse(manifestFile).attribute('package')
                if (pkg != null) {
                    androidExt.namespace = pkg.toString()
                }
            }
        }
    }
}

// Some plugins mix Java and Kotlin JVM targets (for example
// receive_sharing_intent compiles Java as 1.8 and Kotlin as 17), which the
// Kotlin Gradle plugin rejects. Align the Kotlin target to whatever Java
// target the plugin itself uses. This runs in projectsEvaluated because
// some plugins (for example cloud_firestore) only finalize their Java
// settings after evaluation.
gradle.projectsEvaluated {
    rootProject.allprojects { subproject ->
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null) {
            def javaTarget = androidExt.compileOptions.targetCompatibility.toString()
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinTask ->
                kotlinTask.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(javaTarget))
            }
        }
    }
}
