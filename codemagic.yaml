workflows:
  android-release:
    name: ProjectHUD Android Release APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Ensure Android platform wrapper files
        script: |
          flutter create . --platforms=android
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build Android Release APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - vishal108221@gmail.com
        notify:
          success: true
          failure: true
